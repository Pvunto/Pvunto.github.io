name: Update Steam games

on:
  schedule:
    # Una volta al giorno, al minuto 17.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-games-update
  cancel-in-progress: true

jobs:
  update-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update games page from public Steam profile
        run: python3 scripts/update_games.py
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Commit and publish if changed
        run: |
          if git diff --quiet -- games.html; then
            echo "No public Steam changes found."
            exit 0
          fi
          git config user.name "steam-games-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.html
          git commit -m "Auto-update games from Steam [skip steam sync]"
          git push origin HEAD:main
